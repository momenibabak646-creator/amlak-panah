name: Flutter Android CI

concurrency:
  group: amlak-panah-android-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=amlak_panah .
      - name: Download Persian OCR model
        run: |
          mkdir -p assets/tessdata
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fas.traineddata -o assets/tessdata/fas.traineddata
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build Android arm64 release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload release-mode APK
        uses: actions/upload-artifact@v4
        with:
          name: amlak-panah-arm64-release-candidate
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
